[package]
name = "lockdiff"
version = "0.1.0"
edition = "2021"
description = "Diffs two snapshots of the same lockfile (Cargo.lock or package-lock.json) — exactly what a cargo update/npm update actually changed, before you merge it"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/lockdiff"
readme = "README.md"
keywords = ["cargo", "npm", "lockfile", "diff", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "lockdiff"
path = "src/lib.rs"

[[bin]]
name = "lockdiff"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
